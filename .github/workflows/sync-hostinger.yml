name: Sync production to Hostinger repo

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    name: Sync to Hostinger deployment repo
    runs-on: ubuntu-latest
    if: github.repository == 'faizan1405/knoos'

    concurrency:
      group: knoos-hostinger-sync
      cancel-in-progress: false

    env:
      HOSTINGER_REPO_TOKEN: ${{ secrets.HOSTINGER_REPO_TOKEN }}
      HOSTINGER_DEPLOY_BRANCH: ${{ vars.HOSTINGER_DEPLOY_BRANCH }}

    steps:
      - name: Verify secret configured
        run: |
          if [ -z "$HOSTINGER_REPO_TOKEN" ]; then
            echo "ERROR: HOSTINGER_REPO_TOKEN is not configured."
            echo "Go to https://github.com/faizan1405/knoos/settings/secrets/actions"
            echo "and add a repository secret named HOSTINGER_REPO_TOKEN with a fine-grained"
            echo "Personal Access Token from faizanxking24-droid/knoos1 (Contents: read and write)."
            exit 1
          fi

      - name: Resolve target branch
        run: |
          TARGET_BRANCH="${HOSTINGER_DEPLOY_BRANCH:-coupon-reservation-safety}"
          echo "Deploy branch: ${TARGET_BRANCH}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> "$GITHUB_ENV"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Clone Hostinger deployment repository
        run: |
          git clone \
            "https://x-access-token:${HOSTINGER_REPO_TOKEN}@github.com/faizanxking24-droid/knoos1.git" \
            .hostinger-deploy
          cd .hostinger-deploy
          git checkout "${TARGET_BRANCH}"

      - name: Configure git identity
        run: |
          git config --global user.name "KNOOS Deployment Sync"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror source files into deployment repository
        run: |
          set -euo pipefail

          SRC="$(pwd)"
          DEST="${SRC}/.hostinger-deploy"

          rsync \
            --archive \
            --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-hostinger.yml' \
            --exclude='.hostinger-deploy' \
            "${SRC}/" "${DEST}/"

          cd "${DEST}"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes detected - deployment already in sync."
            exit 0
          fi

          git add -A
          git commit -m "deploy: sync faizan1405/knoos@${GITHUB_SHA}"

          git push origin "HEAD:${TARGET_BRANCH}"
